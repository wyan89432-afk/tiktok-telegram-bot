name: TikTok Telegram Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/bot.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tiktok-telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 60 -r requirements.txt
      - name: Verify dependencies
        run: |
          python -m pip check
          python -c "import requests, yt_dlp; from supabase import create_client; print('Dependencies OK')"
      - name: Run bot
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py
